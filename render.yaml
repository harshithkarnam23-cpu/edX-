services:
  - type: web
    name: edx-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /version
    envVars:
      - key: ENV
        value: production
      - key: HMAC_SECRET
        sync: false
      - key: TINYOCR_URL
        sync: false
